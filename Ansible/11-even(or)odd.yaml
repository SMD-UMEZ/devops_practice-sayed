- name: check even or odd
  hosts: localhost
  connection: local
  vars:
   given_no: 5
  tasks:
  - name: is given no. is even?
    debug:
     msg: "YES, given NO. is even"
    when: given_no % 5 == 0

  - name: is given no. is odd?
    debug:
     msg: "YES, given NO. is odd"
    when: given_no % 5 != 0