- name: "COURSE INFORMATION"
  hosts: frontend
  connection: local
  vars:
   COURSE: "DevOps and AiOps" #string
   DURATION: 150 #int/number
   live_session: true #bool
   topics: #list
   - linux
   - shell
   - ansible
   more_details: # map
    months: "5"
    trainer: "siva kumar reddy"
  tasks:
  - name: printing information
    msg: |
      Course_name: {{COURSE}} 
      Duration_time: {{DURATION}}
      is it live? : {{live session}}
      what are the topics covered {{topics}}
      more_details: {{more_details}}       
